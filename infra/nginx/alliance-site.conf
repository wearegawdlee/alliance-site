server {
    listen 80;
    listen [::]:80;

    server_name agdofroswell.com www.agdofroswell.com _;

    root /var/www/alliance-site/dist;
    index index.html;

    access_log /var/log/nginx/alliance-site.access.log;
    error_log /var/log/nginx/alliance-site.error.log;

    # Public Astro-generated static site.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache Astro hashed assets aggressively.
    location /_astro/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Backoffice Express app. The app itself is mounted at /backoffice,
    # so preserve the URI as-is when proxying.
    location /backoffice/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Normalize /backoffice -> /backoffice/ so relative assets/routes behave.
    location = /backoffice {
        return 301 /backoffice/;
    }

    # Basic local/remote health check passthrough.
    location = /backoffice/health {
        proxy_pass http://127.0.0.1:3001/backoffice/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
